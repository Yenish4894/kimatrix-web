name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /home/ubuntu/apps/frontend

            echo ">>> Pulling latest code..."
            git pull origin main

            # `npm ci`: exactly the lockfile, and a hard failure if it disagrees with
            # package.json, rather than resolving different versions than were tested.
            echo ">>> Installing dependencies..."
            npm ci --include=dev

            # Clear previous build output so a deleted route or chunk can't linger, but
            # keep it aside rather than deleting it: a failed build used to leave the
            # site with no build at all. `.next/cache` stays in place — it holds the
            # incremental compiler cache, and removing it makes every deploy a cold build.
            echo ">>> Keeping the previous build..."
            rm -rf .next.prev
            mkdir -p .next .next.prev
            find .next -mindepth 1 -maxdepth 1 ! -name cache -exec cp -a {} .next.prev/ \;
            find .next -mindepth 1 -maxdepth 1 ! -name cache -exec rm -rf {} + 2>/dev/null || true

            echo ">>> Building..."
            if ! npm run build; then
              echo ">>> Build failed — restoring the previous build"
              find .next -mindepth 1 -maxdepth 1 ! -name cache -exec rm -rf {} + 2>/dev/null || true
              cp -a .next.prev/. .next/
              exit 1
            fi

            echo ">>> Restarting frontend..."
            pm2 restart kimatrix-web

            echo ">>> Health check..."
            if ! curl -sf --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:3000 -o /dev/null; then
              pm2 logs kimatrix-web --lines 40 --nostream
              exit 1
            fi

            rm -rf .next.prev
            echo ">>> Deploy complete!"
